<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="utf-8" />
    <title>{% block title %}MonolithOS{% endblock %}</title>
</head>
<body>
    {% block header %}
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <h1>Ссылки:</h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('about') }}">О мне</a></li>
                    <li><a href="{{ url_for('main_page') }}">Главная</a></li>
                </ul>
            </nav>
        </div>
    </header>
    {% endblock %}

    {% block content %}
    {% endblock %}

    <footer>
        <p>Предложить идею или связаться с нами можно ниже</p>
        <form>
            <label for="name">ФИО</label>
            <input id="name" type="text" placeholder="Необязательно">
            
            <label for="email">Емайл</label>
            <input id="email" type="email" placeholder="Введите ваш емайл" required>
            
            <label for="date">Дата</label>
            <input id="date" type="date" required>
            
            <button>Отправить</button>
        </form>
        <p>© 2026 MonolithOS. Все права защищены</p>
    </footer>
</body>
</html>
